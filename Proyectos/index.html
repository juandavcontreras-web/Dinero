<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Proyectos · cuentas y cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15322B; --ink-2:#4A6B61; --paper:#F3F6F1; --card:#FFFFFF;
    --moss:#2F6B57; --moss-soft:#DCEADF; --ocre:#C9872A; --ocre-soft:#F7EBD6;
    --clay:#A3482E; --clay-soft:#F6E4DD; --mist:#E3EAE1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-y:none}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;
  }
  input,textarea,select{-webkit-user-select:text;user-select:text}
  body.quieto{position:fixed;inset:0;overflow:hidden}
  .hoja{max-width:620px;margin:0 auto;padding:0 16px 120px}
  h1,h2,.cifra,.num{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 40,"opsz" 40}

  /* ---- proyectos ---- */
  .carrusel{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .carrusel::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--mist);background:var(--card);color:var(--ink-2);
        border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;white-space:nowrap}
  .chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.mas{color:var(--moss);border-style:dashed}

  /* ---- cabecera del proyecto ---- */
  .cabeza{position:relative;background:var(--ink);color:#fff;border-radius:28px 28px 28px 10px;padding:22px 22px 20px;margin-top:10px;overflow:hidden}
  .cabeza .curva{position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.055)}
  .cabeza h1{margin:0;font-size:21px;font-weight:600;line-height:1.2;position:relative}
  .cabeza .nota{margin-top:3px;font-size:13px;color:#A9C4B9;position:relative}
  .cabeza .total{position:relative;margin-top:16px}
  .cabeza .total .num{font-size:38px;font-weight:600;letter-spacing:-.5px;display:block;line-height:1.05}
  .cabeza .total .pie{font-size:13px;color:#A9C4B9;margin-top:2px}
  .barra{position:relative;height:7px;background:rgba(255,255,255,.16);border-radius:99px;margin-top:14px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--ocre);border-radius:99px}
  .cabeza .editar{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.12);border:none;color:#fff;
        border-radius:999px;font:inherit;font-size:13px;font-weight:600;padding:7px 13px}

  /* ---- secciones ---- */
  section{margin-top:26px}
  section>h2{margin:0 0 4px;font-size:18px;font-weight:600}
  section>.intro{font-size:13px;color:var(--ink-2);margin:0 0 12px}

  /* ---- agregar rápido ---- */
  .rapido{display:flex;gap:8px;align-items:stretch;background:var(--card);border:1px solid var(--mist);
          border-radius:18px;padding:8px;margin-bottom:12px}
  .rapido input{flex:1;min-width:0;border:none;background:transparent;font:inherit;font-size:16px;padding:9px 8px;color:var(--ink)}
  .rapido input:focus{outline:none}
  .rapido input.corto{flex:0 0 108px;text-align:right;font-weight:600}
  .rapido .sep{width:1px;background:var(--mist);margin:6px 0}
  .rapido button{flex:0 0 auto;border:none;background:var(--moss);color:#fff;border-radius:13px;width:44px;font-size:22px;line-height:1}

  /* ---- lista de compras ---- */
  .item{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--mist)}
  .item:last-child{border-bottom:none}
  .item .punto{flex:0 0 10px;height:10px;border-radius:50%;background:var(--moss)}
  .item .punto.falta{background:transparent;border:2px solid var(--ocre)}
  .item .q{flex:1;min-width:0}
  .item .q b{display:block;font-weight:600;font-size:15.5px;word-break:break-word}
  .item .q span{font-size:12.5px;color:var(--ink-2)}
  .item .v{font-family:Fraunces,Georgia,serif;font-size:16px;font-weight:600;white-space:nowrap}
  .item .v.falta{color:var(--ocre);font-size:13px;font-family:inherit;font-weight:600}
  .vacio{color:var(--ink-2);font-size:14px;padding:18px 4px}

  /* ---- integrantes ---- */
  .modo{display:flex;gap:7px;margin-bottom:12px}
  .modo label{flex:1;text-align:center;border:1px solid var(--mist);background:var(--card);border-radius:14px;
        padding:11px 6px;font-size:14px;color:var(--ink-2);font-weight:500}
  .modo input{position:absolute;opacity:0;pointer-events:none}
  .modo label:has(input:checked){background:var(--moss-soft);border-color:var(--moss);color:var(--moss);font-weight:700}

  .gente{display:flex;flex-direction:column;gap:10px}
  .persona{background:var(--card);border:1px solid var(--mist);border-radius:20px;padding:15px 16px}
  .persona .arriba{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .persona .nom{font-size:16.5px;font-weight:600}
  .persona .cuota{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600}
  .persona .pct{font-size:12.5px;color:var(--ink-2)}
  .persona .avance{height:6px;background:var(--mist);border-radius:99px;margin:11px 0 9px;overflow:hidden}
  .persona .avance i{display:block;height:100%;background:var(--moss);border-radius:99px}
  .persona .abajo{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .persona .estado{font-size:13.5px;font-weight:600}
  .persona .estado.debe{color:var(--clay)}
  .persona .estado.pago{color:var(--moss)}
  .persona .abonar{border:1px solid var(--moss);background:var(--card);color:var(--moss);border-radius:999px;
        font:inherit;font-size:13px;font-weight:700;padding:8px 14px;white-space:nowrap}
  .persona .abonar.gris{border-color:var(--mist);color:var(--ink-2)}

  .aviso{background:var(--ocre-soft);color:#7E5411;border-radius:16px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}

  .cierre{background:var(--card);border:1px solid var(--mist);border-radius:22px;padding:16px;margin-top:26px}
  .cierre .linea{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px;color:var(--ink-2)}
  .cierre .linea b{color:var(--ink);font-family:Fraunces,Georgia,serif;font-size:16px}
  .cierre .linea.fuerte{border-top:1px solid var(--mist);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:600}

  .boton{display:block;width:100%;border:none;border-radius:16px;font:inherit;font-size:15px;font-weight:600;
        padding:14px;background:var(--ink);color:#fff;margin-top:10px}
  .boton.suave{background:var(--card);color:var(--ink-2);border:1px solid var(--mist)}
  .boton.peligro{background:var(--card);color:var(--clay);border:1px solid var(--mist)}
  .par{display:flex;gap:9px}
  .par>*{flex:1}

  /* ---- panel ---- */
  .panel{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;background:rgba(21,50,43,.4)}
  .panel .caja{width:100%;max-width:620px;margin:0 auto;background:var(--paper);border-radius:26px 26px 0 0;
        padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .panel h2{margin:0 0 14px;font-size:19px;font-weight:600}
  .campo{margin-bottom:13px}
  .campo label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
  .campo input,.campo textarea,.campo select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
        border:1px solid var(--mist);border-radius:14px;padding:12px}
  .campo input:focus,.campo textarea:focus,.campo select:focus{outline:2px solid var(--moss);outline-offset:1px;border-color:var(--moss)}
  .campo textarea{min-height:70px;resize:vertical}

  .aire{text-align:center;color:var(--ink-2);font-size:14px;padding:46px 20px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;
        padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .oculto{display:none}
  button{cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="carrusel" id="carrusel"></div>

<main class="hoja">
  <div id="todo"></div>
</main>

<div class="panel oculto" id="panel"><div class="caja" id="cajaPanel"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const LLAVE = 'lm_proyectos_v2';
let actual = null;

/* ---------- datos ---------- */
function leer(){ try{ return JSON.parse(localStorage.getItem(LLAVE)||'[]'); }catch(e){ return []; } }
function grabar(a){ try{ localStorage.setItem(LLAVE,JSON.stringify(a)); return true; }catch(e){ aviso('No hay espacio para guardar'); return false; } }
function proy(){ return leer().find(p=>p.id===actual); }
function editar(fn){ const a=leer(), i=a.findIndex(p=>p.id===actual); if(i<0) return; fn(a[i]); grabar(a); }
const id = () => Date.now()+'-'+Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const z = n => String(n).padStart(2,'0');
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function fecha(f){ return f?f.split('-').reverse().join('/'):''; }
const nums = v => Number(String(v).replace(/[^\d]/g,''))||0;
const pct = v => Number(String(v).replace(',','.').replace(/[^\d.]/g,''))||0;
function plata(n){ return '$ '+Math.round(Number(n)||0).toLocaleString('es-CO'); }
function fp(n){ return (Math.round(n*10)/10).toString().replace('.',',')+'%'; }
function aviso(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }

function comprado(p){ return p.compras.filter(c=>c.valor>0).reduce((s,c)=>s+c.valor,0); }
function cuotaDe(p,x){
  const t = comprado(p);
  if(!p.gente.length) return 0;
  return p.reparto==='igual' ? t/p.gente.length : t*pct(x.pct)/100;
}
function abonado(x){ return (x.abonos||[]).reduce((s,a)=>s+(Number(a.valor)||0),0); }

/* ---------- carrusel de proyectos ---------- */
function pintarCarrusel(){
  const ps = leer();
  $('carrusel').innerHTML = ps.map(p=>'<button class="chip" data-ir="'+p.id+'" aria-current="'+(p.id===actual)+'">'+esc(p.nombre)+'</button>').join('')
    + '<button class="chip mas" data-nuevo="1">+ Proyecto</button>';
}

/* ---------- pintar todo ---------- */
function pintar(){
  pintarCarrusel();
  const p = proy();
  if(!p){
    $('todo').innerHTML = '<div class="aire">Aquí llevas las cuentas de cada proyecto:<br>lo que se compra, cuánto va y qué le toca poner a cada quien.<br><br>Crea el primero con <b>+ Proyecto</b>.</div>';
    return;
  }
  const total = comprado(p);
  const pendientes = p.compras.filter(c=>!c.valor);
  const recaudado = p.gente.reduce((s,x)=>s+abonado(x),0);
  const avance = p.presupuesto ? Math.min(100, total*100/p.presupuesto) : 0;

  let h = '';

  /* cabecera */
  h += '<div class="cabeza"><div class="curva"></div>'
    + '<button class="editar" data-editar-proy="1">Ajustes</button>'
    + '<h1>'+esc(p.nombre)+'</h1>'
    + (p.desc?'<div class="nota">'+esc(p.desc)+'</div>':'')
    + '<div class="total"><span class="num">'+plata(total)+'</span>'
    + '<div class="pie">'+(p.presupuesto ? 'de '+plata(p.presupuesto)+' presupuestados' : 'comprado hasta hoy')+'</div></div>'
    + (p.presupuesto?'<div class="barra"><i style="width:'+avance+'%"></i></div>':'')
    + '</div>';

  /* compras */
  h += '<section><h2>Lo que va comprado</h2>'
    + '<p class="intro">Escribe qué compraste y cuánto costó. Si todavía no lo compras, déjalo sin valor y queda como pendiente.</p>'
    + '<div class="rapido"><input id="nQue" placeholder="Qué se compró" autocomplete="off">'
    + '<div class="sep"></div><input id="nVal" class="corto" inputmode="numeric" placeholder="Valor" autocomplete="off">'
    + '<button data-agregar-compra="1">+</button></div>';
  const compras = p.compras.slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  h += compras.length ? compras.map(c=>'<div class="item" data-compra="'+c.id+'">'
      + '<div class="punto'+(c.valor?'':' falta')+'"></div>'
      + '<div class="q"><b>'+esc(c.que)+'</b><span>'+(c.valor?fecha(c.fecha):'pendiente')+(c.quien?' · '+esc(c.quien):'')+(c.nota?' · '+esc(c.nota):'')+'</span></div>'
      + '<div class="v'+(c.valor?'':' falta')+'">'+(c.valor?plata(c.valor):'poner valor')+'</div></div>').join('')
    : '<div class="vacio">Todavía no hay nada anotado.</div>';
  h += '</section>';

  /* gente */
  h += '<section><h2>Quiénes ponen</h2>'
    + '<p class="intro">Solo van los que aportan cuota. Si tú también vas a poner, agrégate como uno más.</p>';
  if(p.reparto==='pct' && p.gente.length){
    const suma = p.gente.reduce((s,x)=>s+pct(x.pct),0);
    if(Math.abs(suma-100)>0.5) h += '<div class="aviso">Los porcentajes suman '+fp(suma)+'. Faltan '+fp(100-suma)+' por repartir.</div>';
  }
  h += '<div class="modo">'
    + '<label><input type="radio" name="modo" value="igual"'+(p.reparto==='igual'?' checked':'')+'>Partes iguales</label>'
    + '<label><input type="radio" name="modo" value="pct"'+(p.reparto==='pct'?' checked':'')+'>Por porcentaje</label></div>'
    + '<div class="rapido"><input id="nNom" placeholder="Nombre del integrante" autocomplete="off">'
    + (p.reparto==='pct'?'<div class="sep"></div><input id="nPct" class="corto" inputmode="decimal" placeholder="%" autocomplete="off">':'')
    + '<button data-agregar-gente="1">+</button></div>';

  h += '<div class="gente">' + (p.gente.length ? p.gente.map(x=>{
      const cuota = cuotaDe(p,x), ab = abonado(x), falta = cuota-ab;
      const avc = cuota>0 ? Math.min(100, ab*100/cuota) : 0;
      const porcentaje = p.reparto==='igual' ? 100/p.gente.length : pct(x.pct);
      return '<div class="persona"><div class="arriba">'
        + '<div><div class="nom" data-gente="'+x.id+'">'+esc(x.nom)+'</div><div class="pct">'+fp(porcentaje)+' del gasto</div></div>'
        + '<div class="cuota">'+plata(cuota)+'</div></div>'
        + '<div class="avance"><i style="width:'+avc+'%"></i></div>'
        + '<div class="abajo"><div class="estado '+(falta>0.5?'debe':'pago')+'">'
        + (falta>0.5 ? 'Ha puesto '+plata(ab)+' · falta '+plata(falta) : (ab>cuota+0.5?'Puso de más '+plata(ab-cuota):'Ya está a paz y salvo'))
        + '</div><div style="display:flex;gap:7px;flex:0 0 auto">'
        + '<button class="abonar gris" data-gente="'+x.id+'">Editar</button>'
        + '<button class="abonar" data-abonar="'+x.id+'">Abonó</button></div></div></div>';
    }).join('') : '<div class="vacio">Agrega a los integrantes para repartir el gasto.</div>') + '</div></section>';

  /* cierre */
  h += '<div class="cierre">'
    + '<div class="linea"><span>Comprado</span><b>'+plata(total)+'</b></div>'
    + (pendientes.length?'<div class="linea"><span>Pendiente por comprar</span><b>'+pendientes.length+' cosa'+(pendientes.length===1?'':'s')+'</b></div>':'')
    + '<div class="linea"><span>Recaudado de los integrantes</span><b>'+plata(recaudado)+'</b></div>'
    + '<div class="linea fuerte"><span>Por recaudar</span><b>'+plata(Math.max(0, p.gente.reduce((s,x)=>s+Math.max(0,cuotaDe(p,x)-abonado(x)),0)))+'</b></div>'
    + '<button class="boton" data-excel="1">Descargar en Excel</button>'
    + '</div>';

  $('todo').innerHTML = h;

  const nq = $('nQue'); if(nq) nq.addEventListener('keydown',e=>{ if(e.key==='Enter') agregarCompra(); });
  const nv = $('nVal'); if(nv){ formatear(nv); nv.addEventListener('keydown',e=>{ if(e.key==='Enter') agregarCompra(); }); }
  const nn = $('nNom'); if(nn) nn.addEventListener('keydown',e=>{ if(e.key==='Enter') agregarGente(); });
  document.querySelectorAll('input[name=modo]').forEach(el=>el.addEventListener('change',()=>{
    editar(p=>{
      p.reparto = el.value;
      if(el.value==='pct' && p.gente.length && p.gente.every(g=>!pct(g.pct))){
        const parte = Math.round(1000/p.gente.length)/10;
        p.gente.forEach(g=>g.pct=String(parte).replace('.',','));
      }
    });
    pintar();
  }));
}
function formatear(el){
  el.addEventListener('input',()=>{ const n=nums(el.value); el.value = n ? n.toLocaleString('es-CO') : ''; });
}

/* ---------- agregar rápido ---------- */
function agregarCompra(){
  const que = $('nQue').value.trim(), val = nums($('nVal').value);
  if(!que){ aviso('Escribe qué se compró'); $('nQue').focus(); return; }
  editar(p=>p.compras.push({id:id(), que, valor:val, fecha:val?hoy():'', quien:'', nota:''}));
  pintar(); $('nQue').focus();
}
function agregarGente(){
  const nom = $('nNom').value.trim();
  if(!nom){ aviso('Escribe el nombre'); $('nNom').focus(); return; }
  const p0 = proy();
  const porcentaje = p0.reparto==='pct' ? ($('nPct')?$('nPct').value.trim():'') : '';
  editar(p=>p.gente.push({id:id(), nom, pct:porcentaje, abonos:[]}));
  pintar(); $('nNom').focus();
}

/* ---------- panel ---------- */
function abrirPanel(html){
  $('cajaPanel').innerHTML = html;
  $('panel').classList.remove('oculto');
  document.body.classList.add('quieto');
}
function cerrarPanel(){ $('panel').classList.add('oculto'); document.body.classList.remove('quieto'); }
$('panel').addEventListener('click', e=>{ if(e.target.id==='panel') cerrarPanel(); });

function panelProyecto(p){
  abrirPanel('<h2>'+(p?'Ajustes del proyecto':'Nuevo proyecto')+'</h2>'
    + '<div class="campo"><label for="pNom">Nombre</label><input id="pNom" value="'+esc(p?p.nombre:'')+'" placeholder="Cómo se llama el proyecto"></div>'
    + '<div class="campo"><label for="pDes">De qué se trata</label><textarea id="pDes" placeholder="Opcional">'+esc(p?p.desc:'')+'</textarea></div>'
    + '<div class="campo"><label for="pPre">Presupuesto (opcional)</label><input id="pPre" inputmode="numeric" value="'+(p&&p.presupuesto?Number(p.presupuesto).toLocaleString('es-CO'):'')+'" placeholder="Para ver cuánto llevas"></div>'
    + '<button class="boton" data-guardar-proy="'+(p?p.id:'')+'">Guardar</button>'
    + (p?'<button class="boton peligro" data-borrar-proy="'+p.id+'">Borrar este proyecto</button>':'')
    + '<button class="boton suave" data-cerrar="1">Cancelar</button>');
  formatear($('pPre'));
  setTimeout(()=>$('pNom').focus(),90);
}
function panelCompra(c){
  const p = proy();
  abrirPanel('<h2>'+esc(c.que)+'</h2>'
    + '<div class="campo"><label for="cQue">Qué se compró</label><input id="cQue" value="'+esc(c.que)+'"></div>'
    + '<div class="campo"><label for="cVal">Valor</label><input id="cVal" inputmode="numeric" value="'+(c.valor?Number(c.valor).toLocaleString('es-CO'):'')+'" placeholder="Déjalo vacío si aún no se compra"></div>'
    + '<div class="campo"><label for="cFec">Fecha</label><input id="cFec" type="date" value="'+(c.fecha||'')+'"></div>'
    + '<div class="campo"><label for="cQui">Quién lo compró</label><input id="cQui" list="listaGente" value="'+esc(c.quien)+'" placeholder="Por defecto tú"></div>'
    + '<datalist id="listaGente">'+p.gente.map(x=>'<option>'+esc(x.nom)+'</option>').join('')+'</datalist>'
    + '<div class="campo"><label for="cNot">Nota</label><input id="cNot" value="'+esc(c.nota)+'" placeholder="Dónde se compró, factura"></div>'
    + '<button class="boton" data-guardar-compra="'+c.id+'">Guardar</button>'
    + '<button class="boton peligro" data-borrar-compra="'+c.id+'">Borrar</button>'
    + '<button class="boton suave" data-cerrar="1">Cancelar</button>');
  formatear($('cVal'));
}
function panelGente(x){
  const p = proy();
  const lista = (x.abonos||[]).slice().reverse();
  abrirPanel('<h2>'+esc(x.nom)+'</h2>'
    + '<div class="campo"><label for="gNom">Nombre</label><input id="gNom" value="'+esc(x.nom)+'"></div>'
    + '<div class="campo"><label for="gPct">Porcentaje de aporte</label><input id="gPct" inputmode="decimal" value="'+esc(x.pct)+'" placeholder="Ej: 25">'
    + (p.reparto==='igual'?'<div style="font-size:12.5px;color:var(--ink-2);margin-top:6px">Ahora el proyecto está en partes iguales, así que este número no se usa. Cambia a “Por porcentaje” para que aplique.</div>':'')+'</div>'
    + (lista.length?'<div class="campo"><label>Abonos</label>'+lista.map(a=>'<div class="item"><div class="q"><b>'+plata(a.valor)+'</b><span>'+fecha(a.fecha)+'</span></div><button class="abonar" data-quitar-abono="'+x.id+'|'+a.id+'">Quitar</button></div>').join('')+'</div>':'')
    + '<button class="boton" data-guardar-gente="'+x.id+'">Guardar</button>'
    + '<button class="boton peligro" data-borrar-gente="'+x.id+'">Quitar del proyecto</button>'
    + '<button class="boton suave" data-cerrar="1">Cancelar</button>');
}
function panelAbono(x){
  const falta = cuotaDe(proy(),x)-abonado(x);
  abrirPanel('<h2>Abono de '+esc(x.nom)+'</h2>'
    + '<p class="intro" style="margin:-8px 0 14px;color:var(--ink-2);font-size:13.5px">'+(falta>0.5?'Le falta '+plata(falta):'Ya está al día')+'</p>'
    + '<div class="campo"><label for="aVal">Cuánto abonó</label><input id="aVal" inputmode="numeric" placeholder="Valor"></div>'
    + '<div class="campo"><label for="aFec">Fecha</label><input id="aFec" type="date" value="'+hoy()+'"></div>'
    + '<button class="boton" data-guardar-abono="'+x.id+'">Registrar abono</button>'
    + '<button class="boton suave" data-cerrar="1">Cancelar</button>');
  formatear($('aVal'));
  if(falta>0.5) $('aVal').value = Math.round(falta).toLocaleString('es-CO');
  setTimeout(()=>$('aVal').select(),90);
}

/* ---------- clics ---------- */
document.addEventListener('click', e=>{
  const t = sel => e.target.closest('['+sel+']');
  let b;
  if(t('data-cerrar')) return cerrarPanel();
  if(b=t('data-ir')){ actual=b.dataset.ir; pintar(); window.scrollTo({top:0}); return; }
  if(t('data-nuevo')) return panelProyecto(null);
  if(t('data-editar-proy')) return panelProyecto(proy());
  if(t('data-agregar-compra')) return agregarCompra();
  if(t('data-agregar-gente')) return agregarGente();
  if(b=t('data-compra')) return panelCompra(proy().compras.find(c=>c.id===b.dataset.compra));
  if(b=t('data-abonar')) return panelAbono(proy().gente.find(x=>x.id===b.dataset.abonar));
  if(b=t('data-gente')) return panelGente(proy().gente.find(x=>x.id===b.dataset.gente));
  if(t('data-excel')) return excel();

  if(b=t('data-guardar-proy')){
    const nom=$('pNom').value.trim();
    if(!nom){ aviso('Ponle nombre al proyecto'); return; }
    const datos={nombre:nom, desc:$('pDes').value.trim(), presupuesto:nums($('pPre').value)};
    const a=leer();
    if(b.dataset.guardarProy){ Object.assign(a.find(p=>p.id===b.dataset.guardarProy), datos); grabar(a); }
    else { const nuevo=Object.assign({id:id(), creado:new Date().toISOString(), reparto:'igual', compras:[], gente:[]}, datos); a.push(nuevo); grabar(a); actual=nuevo.id; }
    cerrarPanel(); pintar(); return;
  }
  if(b=t('data-borrar-proy')){
    const p=leer().find(x=>x.id===b.dataset.borrarProy);
    if(!confirm('¿Borrar "'+p.nombre+'" con todas sus cuentas?')) return;
    grabar(leer().filter(x=>x.id!==p.id)); actual=(leer()[0]||{}).id||null; cerrarPanel(); pintar(); return;
  }
  if(b=t('data-guardar-compra')){
    const cid=b.dataset.guardarCompra, val=nums($('cVal').value);
    editar(p=>{ const c=p.compras.find(x=>x.id===cid);
      c.que=$('cQue').value.trim()||c.que; c.valor=val; c.fecha=$('cFec').value||(val?hoy():'');
      c.quien=$('cQui').value.trim(); c.nota=$('cNot').value.trim(); });
    cerrarPanel(); pintar(); return;
  }
  if(b=t('data-borrar-compra')){
    editar(p=>{ p.compras=p.compras.filter(x=>x.id!==b.dataset.borrarCompra); });
    cerrarPanel(); pintar(); return;
  }
  if(b=t('data-guardar-gente')){
    const gid=b.dataset.guardarGente;
    editar(p=>{ const x=p.gente.find(g=>g.id===gid);
      x.nom=$('gNom').value.trim()||x.nom; if($('gPct')) x.pct=$('gPct').value.trim(); });
    cerrarPanel(); pintar(); return;
  }
  if(b=t('data-borrar-gente')){
    const x=proy().gente.find(g=>g.id===b.dataset.borrarGente);
    if(!confirm('¿Quitar a '+x.nom+' del proyecto?')) return;
    editar(p=>{ p.gente=p.gente.filter(g=>g.id!==x.id); });
    cerrarPanel(); pintar(); return;
  }
  if(b=t('data-guardar-abono')){
    const val=nums($('aVal').value);
    if(!val){ aviso('Escribe cuánto abonó'); return; }
    const gid=b.dataset.guardarAbono, fec=$('aFec').value||hoy();
    editar(p=>{ const x=p.gente.find(g=>g.id===gid); x.abonos=x.abonos||[]; x.abonos.push({id:id(), valor:val, fecha:fec}); });
    cerrarPanel(); pintar(); aviso('Abono registrado'); return;
  }
  if(b=t('data-quitar-abono')){
    const [gid,aid]=b.dataset.quitarAbono.split('|');
    editar(p=>{ const x=p.gente.find(g=>g.id===gid); x.abonos=x.abonos.filter(a=>a.id!==aid); });
    cerrarPanel(); pintar(); return;
  }
});

/* ---------- Excel ---------- */
function excel(){
  const p=proy(); if(!p) return;
  if(!window.XLSX){ aviso('No se pudo cargar el Excel. Revisa la conexión.'); return; }
  const total=comprado(p), libro=XLSX.utils.book_new();

  const compras=p.compras.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).map(c=>({
    'FECHA':fecha(c.fecha), 'QUE SE COMPRO':String(c.que).toLocaleUpperCase('es'),
    'VALOR':c.valor||0, 'ESTADO':c.valor?'COMPRADO':'PENDIENTE',
    'QUIEN COMPRO':String(c.quien||'').toLocaleUpperCase('es'), 'NOTA':String(c.nota||'').toLocaleUpperCase('es')
  }));
  compras.push({'FECHA':'','QUE SE COMPRO':'TOTAL','VALOR':total,'ESTADO':'','QUIEN COMPRO':'','NOTA':''});
  const h1=XLSX.utils.json_to_sheet(compras);
  h1['!cols']=[{wch:12},{wch:40},{wch:14},{wch:12},{wch:20},{wch:30}];
  XLSX.utils.book_append_sheet(libro,h1,'COMPRAS');

  const gente=p.gente.map(x=>{
    const cuota=cuotaDe(p,x), ab=abonado(x);
    return {'INTEGRANTE':String(x.nom).toLocaleUpperCase('es'),
      'PORCENTAJE':Math.round((p.reparto==='igual'?100/p.gente.length:pct(x.pct))*10)/10,
      'CUOTA':Math.round(cuota),'ABONADO':ab,'FALTA':Math.round(Math.max(0,cuota-ab)),
      'ESTADO':(cuota-ab)>0.5?'DEBE':'AL DIA'};
  });
  const h2=XLSX.utils.json_to_sheet(gente);
  h2['!cols']=[{wch:26},{wch:12},{wch:16},{wch:16},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(libro,h2,'CUOTAS');

  const abonos=[];
  p.gente.forEach(x=>(x.abonos||[]).forEach(a=>abonos.push({
    'FECHA':fecha(a.fecha),'INTEGRANTE':String(x.nom).toLocaleUpperCase('es'),'ABONO':a.valor})));
  if(abonos.length){
    abonos.sort((a,b)=>String(a.FECHA).localeCompare(String(b.FECHA)));
    const h3=XLSX.utils.json_to_sheet(abonos);
    h3['!cols']=[{wch:12},{wch:26},{wch:16}];
    XLSX.utils.book_append_sheet(libro,h3,'ABONOS');
  }
  XLSX.writeFile(libro, p.nombre.replace(/[\\/:*?"<>|]/g,'-')+' '+hoy()+'.xlsx');
}

/* ---------- arranque ---------- */
actual = (leer()[0]||{}).id || null;
pintar();
</script>
