<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D0E">
<title>Mi dinero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#100D0E;
    --superficie:#191415;
    --superficie2:#221B1C;
    --linea:#332A2B;
    --rojo:#E0242F;
    --rojo-hondo:#8C1119;
    --ambar:#F0B429;
    --texto:#F4EFEC;
    --tenue:#9C8F8F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--negro);
    color:var(--texto);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:16px;
    line-height:1.45;
    padding:0 18px 64px;
    max-width:560px;
    margin:0 auto;
    font-variant-numeric:tabular-nums;
  }
  .etiqueta{font-size:.8rem;color:var(--tenue);letter-spacing:.01em}

  /* ---------- Saldo ---------- */
  header{padding:34px 0 26px;border-bottom:2px solid var(--rojo)}
  header .etiqueta{margin-bottom:6px}
  #saldo{
    font-size:clamp(2.6rem,13vw,3.6rem);
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.05;
    word-break:break-word;
  }
  #saldo.negativo{color:var(--rojo)}
  .resumen{display:flex;gap:14px;margin-top:20px}
  .resumen div{flex:1}
  .resumen b{display:block;font-size:1.05rem;font-weight:600;margin-top:2px}
  .resumen .entro b{color:var(--ambar)}
  .resumen .salio b{color:var(--rojo)}

  /* ---------- Formulario ---------- */
  form{margin:26px 0 8px}
  label{display:block;font-size:.82rem;color:var(--tenue);margin:0 0 6px}
  input,select,button,textarea{font-family:inherit;font-size:1rem;color:var(--texto)}
  .campo{margin-bottom:14px}
  input[type=text],input[type=date],input[type=number]{
    width:100%;
    background:var(--superficie);
    border:1px solid var(--linea);
    border-radius:10px;
    padding:13px 14px;
    font-variant-numeric:tabular-nums;
  }
  #monto{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
  input:focus-visible,button:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
  .tipo{display:flex;gap:10px}
  .tipo button{
    flex:1;
    background:var(--superficie);
    border:1px solid var(--linea);
    border-radius:10px;
    padding:13px 8px;
    font-weight:600;
    cursor:pointer;
  }
  .tipo button[aria-pressed=true]{background:var(--ambar);border-color:var(--ambar);color:#1A1200}
  .tipo button[data-tipo=salida][aria-pressed=true]{background:var(--rojo);border-color:var(--rojo);color:#fff}
  #guardar{
    width:100%;
    background:var(--rojo);
    border:none;
    border-radius:10px;
    padding:16px;
    font-weight:700;
    font-size:1.02rem;
    color:#fff;
    cursor:pointer;
    margin-top:4px;
  }
  #guardar:active{background:var(--rojo-hondo)}
  #aviso{font-size:.85rem;color:var(--ambar);margin-top:10px;min-height:1.2em}

  /* ---------- Lista ---------- */
  #lista{margin-top:34px}
  .mes{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;padding:18px 0 8px;border-bottom:1px solid var(--linea);
  }
  .mes h2{font-size:1rem;font-weight:600}
  .mes span{font-size:.85rem;color:var(--tenue)}
  .mov{
    display:flex;align-items:flex-start;gap:12px;
    padding:14px 0;border-bottom:1px solid var(--linea);
  }
  .mov .desc{flex:1;min-width:0}
  .mov .desc p{font-size:.97rem;overflow-wrap:anywhere}
  .mov .desc small{color:var(--tenue);font-size:.78rem}
  .mov .valor{font-weight:600;white-space:nowrap}
  .mov.entrada .valor{color:var(--ambar)}
  .mov.salida .valor{color:var(--rojo)}
  .borrar{
    background:none;border:none;color:var(--tenue);
    font-size:1.25rem;line-height:1;padding:2px 4px;cursor:pointer;
  }
  .vacio{padding:28px 0;color:var(--tenue);font-size:.95rem}

  /* ---------- Pie ---------- */
  footer{margin-top:38px;padding-top:20px;border-top:1px solid var(--linea)}
  .acciones{display:flex;flex-wrap:wrap;gap:10px}
  .acciones button{
    flex:1 1 45%;
    background:var(--superficie2);
    border:1px solid var(--linea);
    border-radius:10px;
    padding:12px 10px;
    font-size:.88rem;
    cursor:pointer;
  }
  footer p{font-size:.78rem;color:var(--tenue);margin-top:16px;line-height:1.6}
  @media (prefers-reduced-motion:no-preference){
    #saldo{transition:color .2s ease}
  }
</style>
</head>
<body>

<header>
  <p class="etiqueta">Saldo actual</p>
  <p id="saldo">$ 0</p>
  <div class="resumen">
    <div class="entro"><span class="etiqueta">Entró</span><b id="totalEntro">$ 0</b></div>
    <div class="salio"><span class="etiqueta">Salió</span><b id="totalSalio">$ 0</b></div>
  </div>
</header>

<form id="formulario" autocomplete="off">
  <div class="campo">
    <label for="monto">Monto</label>
    <input type="text" id="monto" inputmode="numeric" placeholder="0" required>
  </div>

  <div class="campo">
    <label>Tipo de movimiento</label>
    <div class="tipo">
      <button type="button" data-tipo="entrada" aria-pressed="true">Entró</button>
      <button type="button" data-tipo="salida" aria-pressed="false">Salió</button>
    </div>
  </div>

  <div class="campo">
    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" placeholder="Ej: remesa, mercado, transporte" maxlength="70">
  </div>

  <div class="campo">
    <label for="fecha">Fecha</label>
    <input type="date" id="fecha" required>
  </div>

  <button type="submit" id="guardar">Guardar movimiento</button>
  <p id="aviso"></p>
</form>

<section id="lista"></section>

<footer>
  <div class="acciones">
    <button type="button" id="btnExcel">Descargar en Excel</button>
    <button type="button" id="btnCopia">Guardar copia</button>
    <button type="button" id="btnRestaurar">Restaurar copia</button>
    <button type="button" id="btnBorrarTodo">Borrar todo</button>
  </div>
  <input type="file" id="archivoCopia" accept=".json" hidden>
  <p>Los movimientos se guardan en este celular, dentro del navegador. Nadie más los ve, aunque la página esté publicada. Si cambias de celular o borras los datos del navegador, se pierden: por eso conviene guardar una copia de vez en cuando.</p>
</footer>

<script>
(function(){
  "use strict";

  var CLAVE = "jd-dinero-v1";
  var datos = [];
  var tipoActual = "entrada";
  var hayAlmacenamiento = true;

  var $saldo = document.getElementById("saldo");
  var $totalEntro = document.getElementById("totalEntro");
  var $totalSalio = document.getElementById("totalSalio");
  var $lista = document.getElementById("lista");
  var $monto = document.getElementById("monto");
  var $descripcion = document.getElementById("descripcion");
  var $fecha = document.getElementById("fecha");
  var $aviso = document.getElementById("aviso");

  var MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

  /* ---------- Guardar y leer ---------- */
  function leer(){
    try{
      var crudo = localStorage.getItem(CLAVE);
      datos = crudo ? JSON.parse(crudo) : [];
      if(!Array.isArray(datos)) datos = [];
    }catch(e){
      datos = [];
      hayAlmacenamiento = false;
    }
  }

  function guardar(){
    try{
      localStorage.setItem(CLAVE, JSON.stringify(datos));
    }catch(e){
      hayAlmacenamiento = false;
      mostrarAviso("No se pudo guardar en este navegador. Abre la página desde GitHub para que quede guardado.");
    }
  }

  function mostrarAviso(texto){
    $aviso.textContent = texto;
    if(texto){
      setTimeout(function(){
        if($aviso.textContent === texto) $aviso.textContent = "";
      }, 4000);
    }
  }

  /* ---------- Formato de plata ---------- */
  function pesos(n){
    var signo = n < 0 ? "-" : "";
    var entero = Math.abs(Math.round(n)).toString();
    return signo + "$ " + entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  }

  function soloNumeros(texto){
    return texto.replace(/\D/g, "");
  }

  $monto.addEventListener("input", function(){
    var limpio = soloNumeros(this.value);
    this.value = limpio ? Number(limpio).toLocaleString("es-CO") : "";
  });

  /* ---------- Botones Entró / Salió ---------- */
  var botonesTipo = document.querySelectorAll(".tipo button");
  Array.prototype.forEach.call(botonesTipo, function(b){
    b.addEventListener("click", function(){
      tipoActual = b.dataset.tipo;
      Array.prototype.forEach.call(botonesTipo, function(otro){
        otro.setAttribute("aria-pressed", otro === b ? "true" : "false");
      });
    });
  });

  /* ---------- Agregar movimiento ---------- */
  document.getElementById("formulario").addEventListener("submit", function(ev){
    ev.preventDefault();
    var valor = Number(soloNumeros($monto.value));
    if(!valor){
      mostrarAviso("Escribe un monto mayor que cero.");
      $monto.focus();
      return;
    }
    if(!$fecha.value){
      mostrarAviso("Elige la fecha del movimiento.");
      return;
    }
    datos.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
      valor: valor,
      tipo: tipoActual,
      descripcion: ($descripcion.value || "").trim() || (tipoActual === "entrada" ? "Ingreso" : "Gasto"),
      fecha: $fecha.value
    });
    guardar();
    pintar();
    $monto.value = "";
    $descripcion.value = "";
    $monto.focus();
    mostrarAviso("Movimiento guardado.");
  });

  /* ---------- Borrar uno ---------- */
  $lista.addEventListener("click", function(ev){
    var boton = ev.target.closest(".borrar");
    if(!boton) return;
    var id = boton.dataset.id;
    var item = datos.find(function(d){ return d.id === id; });
    if(!item) return;
    if(confirm("¿Borrar \"" + item.descripcion + "\" por " + pesos(item.valor) + "?")){
      datos = datos.filter(function(d){ return d.id !== id; });
      guardar();
      pintar();
    }
  });

  /* ---------- Dibujar en pantalla ---------- */
  function pintar(){
    var entro = 0, salio = 0;
    datos.forEach(function(d){
      if(d.tipo === "entrada") entro += d.valor; else salio += d.valor;
    });
    var saldo = entro - salio;
    $saldo.textContent = pesos(saldo);
    $saldo.classList.toggle("negativo", saldo < 0);
    $totalEntro.textContent = pesos(entro);
    $totalSalio.textContent = pesos(salio);

    if(datos.length === 0){
      $lista.innerHTML = '<p class="vacio">Todavía no hay movimientos. Anota el primero arriba.</p>';
      return;
    }

    var ordenados = datos.slice().sort(function(a,b){
      return a.fecha === b.fecha ? (a.id < b.id ? 1 : -1) : (a.fecha < b.fecha ? 1 : -1);
    });

    var html = "";
    var mesActual = "";
    ordenados.forEach(function(d, i){
      var mes = d.fecha.slice(0,7);
      if(mes !== mesActual){
        mesActual = mes;
        var partes = mes.split("-");
        var neto = ordenados.filter(function(x){ return x.fecha.slice(0,7) === mes; })
          .reduce(function(acc,x){ return acc + (x.tipo === "entrada" ? x.valor : -x.valor); }, 0);
        html += '<div class="mes"><h2>' + MESES[Number(partes[1])-1] + " " + partes[0] +
                '</h2><span>Neto del mes ' + pesos(neto) + "</span></div>";
      }
      var dia = Number(d.fecha.slice(8,10));
      html += '<div class="mov ' + d.tipo + '">' +
                '<div class="desc"><p>' + escapar(d.descripcion) + "</p>" +
                "<small>" + dia + " de " + MESES[Number(d.fecha.slice(5,7))-1] + "</small></div>" +
                '<span class="valor">' + (d.tipo === "entrada" ? "+" : "−") + " " + pesos(d.valor) + "</span>" +
                '<button class="borrar" type="button" data-id="' + d.id + '" aria-label="Borrar movimiento">×</button>' +
              "</div>";
    });
    $lista.innerHTML = html;
  }

  function escapar(t){
    return t.replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  /* ---------- Descargas ---------- */
  function descargar(nombre, contenido, tipoMime){
    var blob = new Blob([contenido], {type: tipoMime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("btnExcel").addEventListener("click", function(){
    if(!datos.length){ mostrarAviso("No hay movimientos para descargar."); return; }
    var filas = ["Fecha;Descripcion;Tipo;Monto"];
    datos.slice().sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; }).forEach(function(d){
      filas.push([d.fecha, d.descripcion.replace(/;/g, ","), d.tipo === "entrada" ? "Entró" : "Salió", d.valor].join(";"));
    });
    descargar("mi-dinero.csv", "\uFEFF" + filas.join("\n"), "text/csv;charset=utf-8");
  });

  document.getElementById("btnCopia").addEventListener("click", function(){
    if(!datos.length){ mostrarAviso("No hay movimientos para copiar."); return; }
    descargar("copia-mi-dinero.json", JSON.stringify(datos), "application/json");
  });

  var $archivo = document.getElementById("archivoCopia");
  document.getElementById("btnRestaurar").addEventListener("click", function(){ $archivo.click(); });
  $archivo.addEventListener("change", function(){
    var f = this.files[0];
    if(!f) return;
    var lector = new FileReader();
    lector.onload = function(){
      try{
        var entrante = JSON.parse(lector.result);
        if(!Array.isArray(entrante)) throw new Error();
        datos = entrante;
        guardar();
        pintar();
        mostrarAviso("Copia restaurada.");
      }catch(e){
        mostrarAviso("Ese archivo no es una copia válida.");
      }
    };
    lector.readAsText(f);
    this.value = "";
  });

  document.getElementById("btnBorrarTodo").addEventListener("click", function(){
    if(!datos.length) return;
    if(confirm("Esto borra los " + datos.length + " movimientos. ¿Seguro?")){
      datos = [];
      guardar();
      pintar();
    }
  });

  /* ---------- Arranque ---------- */
  leer();
  var hoy = new Date();
  $fecha.value = hoy.getFullYear() + "-" +
                 String(hoy.getMonth()+1).padStart(2,"0") + "-" +
                 String(hoy.getDate()).padStart(2,"0");
  pintar();
  if(!hayAlmacenamiento){
    mostrarAviso("Este navegador no está guardando datos. Ábrela desde GitHub.");
  }
})();
</script>
</body>
</html>
